name: Build & Deploy to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ steps.meta.outputs.tags }}

          labels: |
            ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            AUTH_TRUST_HOST=${{ secrets.AUTH_TRUST_HOST }}

            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SITE_NAME=${{ secrets.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_EMAIL_ENGINE_MAIL=${{ secrets.NEXT_PUBLIC_EMAIL_ENGINE_MAIL }}
            NEXT_PUBLIC_ADMIN_EMAIL=${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Create VPS application directory
      # --------------------------------------------------

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            mkdir -p "$HOME/apps/yash-organics"

            docker network inspect web_network >/dev/null 2>&1 || \
              docker network create web_network


      # --------------------------------------------------
      # 3. Copy docker-compose.yml to VPS
      # --------------------------------------------------

      - name: Copy Docker Compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          source: "docker-compose.yml"
          target: "apps/yash-organics"


      # --------------------------------------------------
      # 4. Deploy
      # --------------------------------------------------

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}

          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_EMAIL_ENGINE_MAIL: ${{ secrets.NEXT_PUBLIC_EMAIL_ENGINE_MAIL }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}

          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DATABASE_URL,AUTH_SECRET,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET,RESEND_API_KEY,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,ADMIN_EMAIL,AUTH_TRUST_HOST,NEXT_PUBLIC_RAZORPAY_KEY_ID,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SITE_NAME,NEXT_PUBLIC_EMAIL_ENGINE_MAIL,NEXT_PUBLIC_ADMIN_EMAIL,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -e

            mkdir -p "$HOME/apps/yash-organics"

            cd "$HOME/apps/yash-organics"

            echo "Logging into GHCR..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            echo "Creating production .env..."

            cat > .env <<EOF
            DATABASE_URL=$DATABASE_URL
            AUTH_SECRET=$AUTH_SECRET
            RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET
            RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET
            RESEND_API_KEY=$RESEND_API_KEY
            CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
            ADMIN_EMAIL=$ADMIN_EMAIL
            AUTH_TRUST_HOST=$AUTH_TRUST_HOST
            NEXT_PUBLIC_RAZORPAY_KEY_ID=$NEXT_PUBLIC_RAZORPAY_KEY_ID
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_SITE_NAME=$NEXT_PUBLIC_SITE_NAME
            NEXT_PUBLIC_EMAIL_ENGINE_MAIL=$NEXT_PUBLIC_EMAIL_ENGINE_MAIL
            NEXT_PUBLIC_ADMIN_EMAIL=$NEXT_PUBLIC_ADMIN_EMAIL
            EOF

            echo "Pulling latest Docker image..."

            docker compose pull

            echo "Starting application..."

            docker compose up -d

            echo "Running Prisma migrations..."

            docker compose exec -T web prisma migrate deploy

            echo "Cleaning old Docker images..."

            docker image prune -f

            echo "Deployment completed."

            docker compose ps